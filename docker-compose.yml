services:
  backend:
    env_file: backend/.env
    container_name: backend
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    ports:
      - '8000:8000'
    networks:
      - net-tier

  frontend:
    env_file: frontend/.env
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    ports:
      - '3000:3000'
    stdin_open: true
    tty: true
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - net-tier

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

networks:
  net-tier:
    driver: bridge
