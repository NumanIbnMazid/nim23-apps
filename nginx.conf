server {
    listen 80;
    server_name backend.apps.nim23.com;
    
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Redirect HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name backend.apps.nim23.com;

    ssl_certificate /etc/letsencrypt/live/backend.apps.nim23.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.apps.nim23.com/privkey.pem;
    
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
