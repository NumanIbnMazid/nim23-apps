server {
    listen 80;
    server_name apps.nim23.com;

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
    }
}

server {
    listen 80;
    server_name backend.apps.nim23.com;

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
}