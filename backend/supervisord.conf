[supervisord]
nodaemon=true

[program:redis]
command=redis-server
autostart=true
autorestart=true
stderr_logfile=/dev/stderr
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0

[program:uvicorn]
command=sh -c 'uvicorn project.asgi:application \
  --host 0.0.0.0 \
  --port ${PORT:-8000} \
  --workers 3 \
  --timeout-keep-alive 60 \
  --ws-ping-interval 30 \
  --ws-ping-timeout 99999 \
  --log-level info \
  --lifespan off'
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
