server {
    listen 80;
    server_name backend.apps.nim23.com;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name backend.apps.nim23.com;

    ssl_certificate /etc/letsencrypt/live/backend.apps.nim23.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.apps.nim23.com/privkey.pem;

    # SSL settings for secure connections
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';

    # Backend service configuration
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
