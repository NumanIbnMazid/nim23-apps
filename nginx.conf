# HTTP server block for HTTP -> HTTPS redirect
server {
    listen 80;
    server_name backend.apps.nim23.com;

    # Redirect HTTP to HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server block
server {
    listen 443 ssl;
    server_name backend.apps.nim23.com;

    # SSL settings
    ssl_certificate /etc/letsencrypt/live/backend.apps.nim23.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backend.apps.nim23.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:ECDHE-RSA-AES128-GCM-SHA256';

    # Add your Nginx settings for the backend
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
